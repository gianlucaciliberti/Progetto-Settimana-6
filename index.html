<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier — Studio di architettura</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <header>
    <!-- Navbar Bootstrap (navbar-expand-md, sticky in cima) -->
    <nav class="navbar navbar-expand-md navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Atelier</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-menu"
          aria-controls="nav-menu" aria-expanded="false" aria-label="Apri menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav-menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#studio">Studio</a></li>
            <li class="nav-item"><a class="nav-link" href="#servizi">Servizi</a></li>
            <li class="nav-item"><a class="nav-link" href="#contatti">Contatti</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <section id="studio" class="hero p-5 text-light">
    <!-- Hero: titolo grande, sottotitolo, CTA. Sfondo brand. min-height 80vh -->
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 text-center">
          <h1 class="display-4 fw-bold">
            Architettura per spazi che parlano
          </h1>
          <p class="lead mt-3">blablabla</p>
          <a href="#contatti" class="btn btn-lg btn-hero mt-4">Inizia un progetto</a>
        </div>
      </div>
    </div>
  </section>

  <section id="servizi" class="py-5">
    <!-- 3 card servizi affiancate da md in su -->
    <div class="container">
      <div class="text-center mb-5">
        <h2 class="fw-bold">I nostri servizi</h2>
        <p class="text-muted">Tre aree di lavoro, una sola attenzione alla qualità.</p>
      </div>

      <div class="row g-4">

        <div class="col-12 col-md-4">
          <div class="card service-card h-100 p-3 text-center">
            <div class="service-icon mb-3">
              <i class="bi bi-building"></i>
            </div>
            <h5 class="fw-bold">Progettazione residenziale</h5>
            <p class="text-muted">BLABLABLA</p>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="card service-card h-100 p-3 text-center">
            <h5 class="fw-bold">Interior design</h5>
            <p class="text-muted">BLABLABLA</p>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="card service-card h-100 p-3 text-center">
            <h5 class="fw-bold">Ristrutturazioni</h5>
            <p class="text-muted">BLABLABLA</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="contatti">
    <!-- Form contatti Bootstrap, larghezza limitata e centrata -->
  </section>

  <footer>
    <!-- 3 colonne: Atelier+indirizzo / Link / Contatti. Copyright in fondo -->
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
